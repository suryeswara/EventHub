<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Error — EventHub</title>
</head>
<body>
<div th:fragment="content">
    <div class="card" style="max-width: 550px; margin: 4rem auto; text-align: center; padding: 3rem 2rem;">
        <span style="font-size: 3.5rem; display: block; margin-bottom: 1rem;">⚠️</span>
        <h2>Something Went Wrong</h2>
        <p style="color: var(--text-muted); margin: 0.75rem 0 2rem;">
            An unexpected error occurred while processing your request. Please try again.
        </p>
        <a th:href="@{/events}" class="btn btn-primary">Return to Events</a>
    </div>
</div>
</body>
</html>
