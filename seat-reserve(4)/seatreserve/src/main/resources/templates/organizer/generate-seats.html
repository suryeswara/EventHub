<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::content})}">
<head>
    <title>Generate Seats — EventHub</title>
</head>
<body>
<div th:fragment="content">
    <div style="margin-bottom: 1.5rem;">
        <a th:href="@{/sessions/{id}(id=${eventSession.id})}" style="color: var(--text-muted); font-size: 0.9rem;">
            &larr; Back to Session
        </a>
    </div>

    <div class="card form-card" style="max-width: 600px;">
        <div style="margin-bottom: 2rem;">
            <span class="brand-badge" style="margin-bottom: 0.5rem; display: inline-block;">Seat Grid Generator</span>
            <h2>Generate Physical Seats</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                Configure the seat layout for session: <strong th:text="${eventSession.title}" style="color: #fff;">Workshop</strong>
            </p>
            <div style="margin-top: 0.75rem; background: rgba(99, 102, 241, 0.1); border: 1px solid var(--border-accent); padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; color: #c7d2fe;">
                Target Room Capacity: <strong th:text="${eventSession.capacity}">30</strong> seats. 
                (Rows &times; Seats Per Row must equal capacity).
            </div>
        </div>

        <form th:action="@{/sessions/{id}/seats/generate(id=${eventSession.id})}" method="post">
            <div class="form-group">
                <label for="section" class="form-label">Section Name / Code</label>
                <input type="text" id="section" name="section" class="form-input" 
                       value="A" placeholder="e.g. A, Orchestra, Main" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="rows" class="form-label">Number of Rows</label>
                    <input type="number" id="rows" name="rows" class="form-input" 
                           min="1" max="100" value="3" required>
                </div>

                <div class="form-group">
                    <label for="seatsPerRow" class="form-label">Seats per Row</label>
                    <input type="number" id="seatsPerRow" name="seatsPerRow" class="form-input" 
                           min="1" max="100" value="10" required>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    Generate Seats Grid &rarr;
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
