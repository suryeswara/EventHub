spring:
  application:
    name: seat-reserve
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5433/seatreserve
    username: seatreserve
    password: seatreserve
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
    open-in-view: false     # avoid lazy-loading leaking into the web layer
    properties:
      hibernate:
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

reservation:
  hold-ttl-seconds: 300   # 5-minute hold window
  sweep-interval-ms: 30000 # 30-second background sweep for expired holds

payment:
  gateway:
    delay-ms: 500         # artificial gateway latency
    failure-rate: 0.1     # configurable failure rate for demoing both paths (0.1 = 10%)

jwt:
  secret: "change-me-in-a-real-env-file-this-is-a-dev-only-secret-value"
  expiration-ms: 3600000  # 1 hour

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:-SYSTEM}] %5p [%15.15t] %-40.40logger{39} : %m%n"
