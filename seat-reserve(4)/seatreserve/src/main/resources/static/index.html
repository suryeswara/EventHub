<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Radio — Hall A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10131A;
    --panel:#171B24;
    --panel-edge:#232838;
    --gold:#E8B04B;
    --gold-dim:#3a3220;
    --coral:#F2795C;
    --slate:#3A4152;
    --text:#F5F2EA;
    --text-muted:#8A93A6;
    --danger:#D9534F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(232,176,75,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
  }

  .app{
    max-width:1100px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid var(--panel-edge);
    padding-bottom:18px;
    margin-bottom:36px;
  }
  .brand{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--text-muted);
  }
  .brand strong{ color:var(--gold); font-weight:600; }
  .event-title{
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 4vw, 40px);
    line-height:1.05;
    margin:0;
  }
  .event-meta{
    font-size:14px;
    color:var(--text-muted);
    margin-top:6px;
  }

  .layout{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:40px;
    align-items:start;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns:1fr; }
  }

  .stage-wrap{ text-align:center; margin-bottom:34px; }
  .stage{
    display:inline-block;
    padding:10px 60px;
    font-family:'Archivo', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.08em;
    color:#0E1116;
    background:linear-gradient(180deg, var(--gold), #c98f30);
    border-radius:3px;
    box-shadow:0 0 40px 6px rgba(232,176,75,0.35);
  }

  .map{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .section{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
  }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:2px;
  }
  .row{
    display:flex;
    gap:7px;
  }

  .seat{
    width:22px;
    height:22px;
    border-radius:5px 5px 8px 8px;
    border:none;
    cursor:pointer;
    background:var(--gold);
    box-shadow:0 0 6px 1px rgba(232,176,75,0.45);
    transition:transform 120ms ease, box-shadow 120ms ease;
    padding:0;
  }
  .seat:hover{ transform:translateY(-2px); }
  .seat:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }

  .seat.held{
    background:var(--coral);
    box-shadow:0 0 10px 2px rgba(242,121,92,0.55);
    cursor:default;
    animation:glow 1.4s ease-in-out infinite;
  }
  .seat.booked{
    background:var(--slate);
    box-shadow:none;
    cursor:not-allowed;
  }
  .seat.selected{
    box-shadow:0 0 0 2px var(--text), 0 0 14px 3px rgba(232,176,75,0.6);
  }
  .seat.pulse{ animation:pulse-on 520ms ease-out; }
  .seat.shake{ animation:shake 420ms ease; }

  @keyframes glow{
    0%,100%{ box-shadow:0 0 10px 2px rgba(242,121,92,0.55); }
    50%{ box-shadow:0 0 16px 4px rgba(242,121,92,0.85); }
  }
  @keyframes pulse-on{
    0%{ transform:scale(0.7); box-shadow:0 0 0 0 rgba(232,176,75,0.8); }
    70%{ transform:scale(1.15); }
    100%{ transform:scale(1); }
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-3px); }
    75%{ transform:translateX(3px); }
  }
  @media (prefers-reduced-motion: reduce){
    .seat, .seat.held, .seat.pulse, .seat.shake{ animation:none !important; transition:none !important; }
  }

  /* Ticket stub panel */
  .stub{
    background:var(--panel);
    border:1px solid var(--panel-edge);
    border-radius:10px;
    padding:22px 20px;
    position:relative;
    overflow:hidden;
  }
  .stub::before{
    content:"";
    position:absolute;
    top:0; bottom:0; right:64px;
    width:0;
    border-left:2px dashed var(--panel-edge);
  }
  .stub-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:4px;
  }
  .stub-seat{
    font-family:'Archivo', sans-serif;
    font-weight:800;
    font-size:32px;
    line-height:1;
  }
  .stub-sub{
    font-size:13px;
    color:var(--text-muted);
    margin-top:6px;
  }
  .stub-empty{
    color:var(--text-muted);
    font-size:14px;
    line-height:1.5;
  }
  .stub-timer{
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    margin:18px 0 4px;
    color:var(--coral);
  }
  .stub-timer-label{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }

  button.confirm{
    width:100%;
    margin-top:16px;
    padding:12px 14px;
    border:none;
    border-radius:6px;
    background:var(--gold);
    color:#0E1116;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button.confirm:hover{ filter:brightness(1.06); }
  button.confirm:disabled{ opacity:0.5; cursor:default; }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(12px);
    background:var(--panel);
    border:1px solid var(--panel-edge);
    color:var(--text);
    padding:12px 18px;
    border-radius:8px;
    font-size:14px;
    opacity:0;
    transition:opacity 200ms ease, transform 200ms ease;
    pointer-events:none;
    max-width:90vw;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.error{ border-color:var(--danger); }
  .toast.success{ border-color:var(--gold); }

  .legend{
    display:flex;
    gap:18px;
    justify-content:center;
    margin-top:26px;
    font-size:12px;
    color:var(--text-muted);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:10px; height:10px; border-radius:3px; display:inline-block; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand"><strong>seat-reserve</strong> · box office</div>
      <h1 class="event-title" id="eventName">Midnight Radio</h1>
      <div class="event-meta" id="eventMeta">Hall A</div>
    </div>
  </header>

  <div class="layout">
    <div>
      <div class="stage-wrap"><span class="stage">Stage</span></div>
      <div class="map" id="map"></div>
      <div class="legend">
        <span><i style="background:var(--gold)"></i> Available</span>
        <span><i style="background:var(--coral)"></i> Held</span>
        <span><i style="background:var(--slate)"></i> Booked</span>
      </div>
    </div>

    <div class="stub" id="stub">
      <div class="stub-empty">Pick a lit seat to start a hold. You'll have five minutes to confirm before it's released.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const EVENT_ID = 1; // demo event seeded by V2__dev_seed_data.sql
  const DEMO_USER_ID = 2; // seeded demo customer — replace once JWT auth lands

  const mapEl = document.getElementById('map');
  const stubEl = document.getElementById('stub');
  const toastEl = document.getElementById('toast');

  let seats = [];
  let activeReservation = null; // { reservationId, seatId, expiresAt }
  let countdownTimer = null;
  let demoMode = false;

  function toast(message, kind){
    toastEl.textContent = message;
    toastEl.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toastEl.className = 'toast'; }, 3200);
  }

  // ---- API layer -------------------------------------------------
  // Talks to the real backend at relative /api/v1 paths. If the
  // backend isn't reachable (e.g. previewing this file on its own),
  // falls back to an in-memory demo so the design can still be seen
  // and interacted with.
  async function apiListSeats(){
    try{
      const res = await fetch(`/api/v1/events/${EVENT_ID}/seats`);
      if(!res.ok) throw new Error('bad status');
      const data = await res.json();
      if(!Array.isArray(data) || data.length === 0) throw new Error('empty');
      return data;
    }catch(e){
      demoMode = true;
      return buildDemoSeats();
    }
  }

  async function apiHold(seatId){
    if(demoMode) return demoHold(seatId);
    const res = await fetch(`/api/v1/events/${EVENT_ID}/seats/${seatId}/hold`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ userId: DEMO_USER_ID })
    });
    if(res.status === 409){ throw { conflict:true }; }
    if(!res.ok){ throw new Error('hold failed'); }
    return res.json();
  }

  async function apiConfirm(reservationId){
    if(demoMode) return demoConfirm(reservationId);
    const res = await fetch(`/api/v1/reservations/${reservationId}/confirm`, {
      method:'POST',
      headers:{ 'Idempotency-Key': 'ui-' + reservationId + '-' + Date.now() }
    });
    if(!res.ok){ throw new Error('confirm failed'); }
    return res.json();
  }

  // ---- Demo fallback (no backend needed) --------------------------
  function buildDemoSeats(){
    const out = [];
    let id = 1;
    ['A','B','C'].forEach(section => {
      for(let row=1; row<=4; row++){
        for(let n=1; n<=8; n++){
          out.push({ id:id++, section, rowLabel:String(row), seatNumber:n, status:'AVAILABLE' });
        }
      }
    });
    return out;
  }
  function demoHold(seatId){
    const seat = seats.find(s => s.id === seatId);
    if(!seat || seat.status !== 'AVAILABLE') return Promise.reject({ conflict:true });
    seat.status = 'HELD';
    const reservationId = 'demo-' + seatId;
    return Promise.resolve({
      reservationId, seatId,
      status:'PENDING',
      expiresAt: new Date(Date.now() + 5*60*1000).toISOString()
    });
  }
  function demoConfirm(reservationId){
    const seatId = activeReservation.seatId;
    const seat = seats.find(s => s.id === seatId);
    if(seat) seat.status = 'BOOKED';
    return Promise.resolve({ reservationId, seatId, status:'CONFIRMED' });
  }

  // ---- Rendering ---------------------------------------------------
  function render(){
    mapEl.innerHTML = '';
    const bySection = {};
    seats.forEach(s => {
      bySection[s.section] = bySection[s.section] || {};
      bySection[s.section][s.rowLabel] = bySection[s.section][s.rowLabel] || [];
      bySection[s.section][s.rowLabel].push(s);
    });

    Object.keys(bySection).sort().forEach(sectionName => {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'section';
      const label = document.createElement('div');
      label.className = 'section-label';
      label.textContent = 'Section ' + sectionName;
      sectionEl.appendChild(label);

      Object.keys(bySection[sectionName]).sort((a,b)=>a-b).forEach(rowLabel => {
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        bySection[sectionName][rowLabel]
          .sort((a,b)=>a.seatNumber-b.seatNumber)
          .forEach(seat => rowEl.appendChild(seatButton(seat)));
        sectionEl.appendChild(rowEl);
      });
      mapEl.appendChild(sectionEl);
    });
  }

  function seatButton(seat){
    const btn = document.createElement('button');
    btn.className = 'seat ' + seat.status.toLowerCase();
    btn.setAttribute('aria-label',
      `Section ${seat.section}, row ${seat.rowLabel}, seat ${seat.seatNumber} — ${seat.status.toLowerCase()}`);
    btn.dataset.seatId = seat.id;
    if(activeReservation && activeReservation.seatId === seat.id){
      btn.classList.add('selected');
    }
    btn.addEventListener('click', () => onSeatClick(seat, btn));
    return btn;
  }

  async function onSeatClick(seat, btn){
    if(seat.status !== 'AVAILABLE') return;
    btn.disabled = true;
    try{
      const reservation = await apiHold(seat.id);
      seat.status = 'HELD';
      activeReservation = {
        reservationId: reservation.reservationId,
        seatId: seat.id,
        expiresAt: reservation.expiresAt
      };
      btn.classList.add('pulse');
      render();
      renderStub();
      startCountdown();
      toast(`Seat ${seat.section}${seat.rowLabel}-${seat.seatNumber} held for 5 minutes`, 'success');
    }catch(err){
      btn.classList.add('shake');
      setTimeout(() => btn.classList.remove('shake'), 420);
      toast('Someone just took that seat — pick another', 'error');
      await refreshSeats();
    }finally{
      btn.disabled = false;
    }
  }

  function renderStub(){
    if(!activeReservation){
      stubEl.innerHTML = `<div class="stub-empty">Pick a lit seat to start a hold. You'll have five minutes to confirm before it's released.</div>`;
      return;
    }
    const seat = seats.find(s => s.id === activeReservation.seatId);
    stubEl.innerHTML = `
      <div class="stub-eyebrow">Your hold</div>
      <div class="stub-seat">${seat.section}${seat.rowLabel}-${seat.seatNumber}</div>
      <div class="stub-sub">Midnight Radio · Hall A</div>
      <div class="stub-timer-label">Time remaining</div>
      <div class="stub-timer" id="stubTimer">5:00</div>
      <button class="confirm" id="confirmBtn">Confirm seat</button>
    `;
    document.getElementById('confirmBtn').addEventListener('click', onConfirm);
  }

  async function onConfirm(){
    const confirmBtn = document.getElementById('confirmBtn');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Confirming…';
    try{
      await apiConfirm(activeReservation.reservationId);
      const seat = seats.find(s => s.id === activeReservation.seatId);
      seat.status = 'BOOKED';
      toast(`Seat ${seat.section}${seat.rowLabel}-${seat.seatNumber} confirmed`, 'success');
      clearInterval(countdownTimer);
      activeReservation = null;
      render();
      renderStub();
    }catch(err){
      toast('Hold expired before confirming — pick another seat', 'error');
      clearInterval(countdownTimer);
      activeReservation = null;
      await refreshSeats();
      renderStub();
    }
  }

  function startCountdown(){
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      if(!activeReservation) return clearInterval(countdownTimer);
      const remainingMs = new Date(activeReservation.expiresAt).getTime() - Date.now();
      const timerEl = document.getElementById('stubTimer');
      if(remainingMs <= 0){
        clearInterval(countdownTimer);
        if(timerEl) timerEl.textContent = '0:00';
        toast('Hold expired — seat released', 'error');
        activeReservation = null;
        refreshSeats().then(renderStub);
        return;
      }
      const m = Math.floor(remainingMs / 60000);
      const s = Math.floor((remainingMs % 60000) / 1000).toString().padStart(2,'0');
      if(timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);
  }

  async function refreshSeats(){
    seats = await apiListSeats();
    render();
  }

  // ---- Boot ----------------------------------------------------------
  (async function init(){
    seats = await apiListSeats();
    render();
    renderStub();
    if(demoMode){
      toast('Backend not reachable — showing a local demo', null);
    }
  })();
})();
</script>
</body>
</html>
